[Unit]
# Start only after Pi-hole FTL is up
After=pihole-FTL.service network-online.target
Wants=pihole-FTL.service network-online.target

[Service]
# Block start until the Pi-hole API answers (no $ - systemd would expand it)
ExecStartPre=/bin/sh -c 'until curl -sf -o /dev/null http://localhost/api/info/login; do sleep 2; done'
TimeoutStartSec=120
