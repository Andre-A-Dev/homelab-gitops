# shellcheck shell=bash disable=SC2034
# =============================================================================
# apticron.conf  ->  symlinked to /etc/apticron/apticron.conf on every Host
# =============================================================================
# Same settings on Mnemosyne, Boreas, Zephyros and Hephaestus. apticron sources
# this file as bash after its defaults in /usr/lib/apticron/apticron.conf, so a
# git pull on the host takes effect with the next daily run.
#
# Recipients live in /etc/apticron/apticron.local.conf
#
# =============================================================================

# Mail only when updates are available.
NOTIFY_NO_UPDATES="0"

# Report each pending package once, not every day until the monthly update
# window. Without it the same list arrived daily until it was installed.
DIFF_ONLY="1"

# The report goes to ntfy.sh, a public server. apticron would list every
# address of the host (public IPv6, Tailscale, Docker bridges): it only
# collects them when IPADDRESSES is empty, so a fixed word keeps them out.
IPADDRESSES="omitted"

# NUM_PACKAGES is counted before the DIFF_ONLY filter: it is the total pending,
# not the number of new packages in this mail.
CUSTOM_SUBJECT='[apticron] $SYSTEM: new updates ($NUM_PACKAGES pending in total)'

# Recipients (EMAIL="...") - host-local. apticron runs under `bash -e` and
# sources this file as the last command of an && list: the file must end with
# a successful command, so `if` instead of `[ -r ] && .`. Without the local file
# apticron falls back to EMAIL="root".
if [ -r /etc/apticron/apticron.local.conf ]; then
    . /etc/apticron/apticron.local.conf
fi
