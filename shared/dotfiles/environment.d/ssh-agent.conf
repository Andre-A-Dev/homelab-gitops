# OpenSSH agent (ssh-agent.socket user unit) for the whole session, incl. VS Code.
# AddKeysToAgent confirm in ~/.ssh/config makes the agent ask for confirmation via ksshaskpass on every key use.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
SSH_ASKPASS=/usr/bin/ksshaskpass
SSH_ASKPASS_REQUIRE=prefer
