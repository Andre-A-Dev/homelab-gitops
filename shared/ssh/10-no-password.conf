# 10-no-password.conf — key-only SSH login, installed to /etc/ssh/sshd_config.d/
#
# Sorts before 50-cloud-init.conf (PasswordAuthentication yes from the Pi
# Imager); sshd uses the first value it reads.
# Installed as a copy, not a symlink: the cron git pull on the Pis must never
# change sshd config. See RUNBOOK "Disable SSH Password Login".
PasswordAuthentication no
