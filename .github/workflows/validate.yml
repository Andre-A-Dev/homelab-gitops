name: Validate configs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The checks are the same scripts the private Gitea CI runs before every
    # deploy (scripts/ci/). This file used to carry its own inline copies; they
    # drifted, and a `find | while` loop set its failure flag in a subshell, so
    # broken dashboards, .env.example drift and shellcheck findings all passed.
    #
    # Not run here: promtool/amtool (the Gitea CI copies them out of the images
    # running on the host) and the executable-bit and stderr checks.
    #
    # Every check runs even if an earlier one failed (`!cancelled()`), and
    # any failed step fails the job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml

      - name: Validate compose, alert rules and dashboards
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_configs.py

      - name: Check env drift
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_env_drift.py

      - name: Lint shell scripts
        if: ${{ !cancelled() }}
        run: |
          # xargs exits 123 if any shellcheck run failed; that fails the step.
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck --severity=warning --external-sources --color=never
          shellcheck --severity=warning --color=never shared/apticron/apticron.conf

      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_VALIDATE_TOPIC }}
        run: ./scripts/ci/notify.sh failure "Homelab CI failed"
