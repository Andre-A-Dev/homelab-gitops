name: Sync docs to Wiki

on:
  push:
    branches: [main]
    paths:
      - wiki/**.md
      - ARCHITECTURE.md
      - RUNBOOK.md
      - SERVICES.md
  workflow_dispatch:    # allows manual trigger from GitHub Actions UI

# Two quick pushes would otherwise race on `git push` to the wiki repo.
concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clone wiki
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki-repo

      - name: Copy all markdown files from wiki/ to wiki repo
        run: |
          # The repo is the source of truth: pages renamed or deleted there
          # would otherwise stay in the wiki forever. Pages created only in the
          # wiki UI are dropped too; the wiki's own git history keeps them.
          rm -f wiki-repo/*.md
          cp wiki/*.md       wiki-repo/
          cp ARCHITECTURE.md wiki-repo/Architecture.md
          cp RUNBOOK.md      wiki-repo/Runbook.md
          cp SERVICES.md     wiki-repo/Services.md

      - name: Commit and push wiki
        run: |
          cd wiki-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes — wiki already up to date" && exit 0
          git commit -m "sync: update from repo (${GITHUB_SHA::7})"
          git push