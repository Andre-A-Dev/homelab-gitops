services:
  caddy:
    image: caddy:2
    container_name: caddy
    labels:
      homelab.update-class: "B"
    env_file:
      - .env
    # IPv4 only: docker-proxy would hand IPv6 clients to Caddy with a Docker
    # gateway address, which passes the lan_only snippet (see Caddyfile).
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /mnt/vault/caddy/data:/data
      - /mnt/vault/caddy/config:/config
    networks:
      - caddy_proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  caddy_proxy:
    external: true
