services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    labels:
      homelab.update-class: "A"
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - LOG_LEVEL=warn
      # Browser extension >= 2026.9 only fills HTTP basic auth prompts
      # (galatea.home) when the server enables this flag.
      - EXPERIMENTAL_CLIENT_FEATURE_FLAGS=enable-basic-auth-response
    volumes:
      - /mnt/vault/vaultwarden/data:/data
    networks:
      - caddy_proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s  # Vaultwarden starts fast, 10s is generous

networks:
  caddy_proxy:
    external: true
