---
services:

  carousel:
    build: .
    image: carousel:latest
    container_name: carousel
    labels:
      homelab.update-class: "C"
      diun.enable: "false"   # local build, not in any registry
    restart: unless-stopped
    volumes:
      - /mnt/codex/carousel/jobs:/data/jobs
      - ./templates_ig:/srv/carousel/templates_ig
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true