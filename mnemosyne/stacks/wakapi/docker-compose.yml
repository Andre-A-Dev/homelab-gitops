services:
  wakapi:
    image: n1try/wakapi:2
    container_name: wakapi
    labels:
      homelab.update-class: "A"
      # Diun: new tags from the pinned one upward; move the lower bound with the tag.
      diun.watch_repo: "true"
      diun.include_tags: '^([2-9]|[1-9][0-9])$$'
    restart: unless-stopped
    env_file: .env
    environment:
      # Prometheus metrics under /api/metrics (default: off). Scraped by the
      # monitoring stack with a per-user API key, see prometheus.yml.
      WAKAPI_EXPOSE_METRICS: "true"
    volumes:
      - /mnt/codex/wakapi:/data
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true