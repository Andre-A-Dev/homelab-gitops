services:
  ghost:
    image: ghost:6
    container_name: ghost
    labels:
      homelab.update-class: "A"
      # Diun: new tags from the pinned one upward; move the lower bound with the tag.
      diun.watch_repo: "true"
      diun.include_tags: '^([6-9]|[1-9][0-9])$$'
    environment:
      - url=https://blog.yourdomain.dedyn.io           # Finale öffentliche URL eintragen
      - database__client=mysql
      - database__connection__host=ghost-db
      - database__connection__user=ghost
      - database__connection__password=${GHOST_DB_PASSWORD}
      - database__connection__database=ghost
      - mail__transport=SMTP                  # Optional: E-Mail für Kommentar-Benachrichtigungen
      - mail__options__host=${MAIL_HOST}
      - mail__options__port=${MAIL_PORT}
      - mail__options__auth__user=${MAIL_USER}
      - mail__options__auth__pass=${MAIL_PASS}
      - mail__from=${MAIL_FROM}
      - mail__options__secureConnection=false
    volumes:
      - /mnt/codex/ghost/content:/var/lib/ghost/content
    networks:
      - caddy_proxy
      - ghost_internal
    depends_on:
      - ghost-db
    restart: unless-stopped

  ghost-db:
    # Pinned to minor: 8.4 is the LTS line (support until 2032). In-place
    # upgrades work, downgrades do not - roll back from the ghost-db.sql dump.
    image: mysql:8.4
    container_name: ghost-db
    labels:
      homelab.update-class: "A"
    environment:
      - MYSQL_ROOT_PASSWORD=${GHOST_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=ghost
      - MYSQL_USER=ghost
      - MYSQL_PASSWORD=${GHOST_DB_PASSWORD}
    volumes:
      - /mnt/codex/ghost/db:/var/lib/mysql
    networks:
      - ghost_internal
    restart: unless-stopped

networks:
  caddy_proxy:
    external: true
  ghost_internal:
    internal: true