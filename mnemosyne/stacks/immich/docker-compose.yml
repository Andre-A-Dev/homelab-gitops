services:

  immich-server:
    # Pinned to major. Server and ML must run the same version: bump both together.
    image: ghcr.io/immich-app/immich-server:v3
    container_name: immich-server
    labels:
      homelab.update-class: "A"
      # Diun: new tags from the pinned one upward; move the lower bound with the tag.
      diun.watch_repo: "true"
      diun.include_tags: '^v([3-9]|[1-9][0-9])$$'
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - caddy_proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2283/api/server/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3  # same tag as immich-server
    container_name: immich-machine-learning
    labels:
      homelab.update-class: "A"
    volumes:
      # ML model cache — persisted so models aren't re-downloaded on restart
      - immich-model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped

  redis:
    # Valkey instead of Redis, same as upstream Immich. Job queue only, no volume:
    # queued jobs are lost on recreate, Immich reschedules them.
    image: docker.io/valkey/valkey:9
    container_name: redis
    labels:
      homelab.update-class: "B"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    # VectorChord extension required by Immich (>= v3.0) for vector similarity search (face/CLIP)
    # pgvecto.rs support kept only for restoring pre-migration backups; safe to drop later via
    # ghcr.io/immich-app/postgres:14-vectorchord0.4.3 (no "-pgvectors" suffix)
    # Service name must be "database" — Immich expects this hostname in DATABASE_URL
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-db
    labels:
      homelab.update-class: "A"
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" ||
        exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}"
        --username="$${POSTGRES_USER}" --tuples-only --no-align
        --command='SELECT COALESCE(SUM(checksum_failures), 0)
        FROM pg_stat_database')"; echo "checksum failures: $${Chksum}";
        [ "$${Chksum}" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m

volumes:
  # Named volume for ML models (~1 GB) — survives container restarts/updates
  immich-model-cache:

networks:
  # caddy_proxy allows Caddy to reach immich-server by container name
  caddy_proxy:
    external: true
  default:
