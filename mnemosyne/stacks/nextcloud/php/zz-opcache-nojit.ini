; Disable OPcache JIT.
; Reason: Apache workers segfault (AH00052) on every request after in-place
; app updates via web UI - stale JIT code in shared memory (aarch64, PHP 8.5).
; "zz-" prefix ensures this loads after the image's opcache-recommended.ini.
opcache.jit=disable
opcache.jit_buffer_size=0
