services:
  galatea:
    build: .
    container_name: galatea
    labels:
      homelab.update-class: "C"
      diun.enable: "false"   # local build, not in any registry
    restart: unless-stopped
    # Must own ./data — check on the host with: id -u; id -g
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    volumes:
      - ./data:/app/data
    # No host port: reachable only through Caddy (basic auth + token injection).
    networks:
      - caddy_proxy
      # Only needed if Prometheus is NOT on caddy_proxy — see README "Metrics".
      # - monitoring_monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status != 200)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  caddy_proxy:
    external: true
  # monitoring_monitoring:
  #   external: true
