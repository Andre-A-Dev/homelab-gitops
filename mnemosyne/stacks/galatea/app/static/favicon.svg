<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three printed layers, narrowing as they rise: a form taking shape.
       The taper has to be strong, or three bars just read as a menu icon.
       Bold shapes survive 16 px, where a nozzle outline turns to mush. Colours follow the viewer's theme. -->
  <style>
    .plate { fill: #1f6f78; }
    .layer { fill: #f8faf9; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #5fb3bc; }
      .layer { fill: #152023; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7"/>
  <g class="layer">
    <rect x="4"    y="20" width="24" height="5" rx="2.5"/>
    <rect x="7.5"  y="13" width="17" height="5" rx="2.5"/>
    <rect x="11"   y="6"  width="10" height="5" rx="2.5"/>
  </g>
</svg>
