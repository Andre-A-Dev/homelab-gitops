groups:
  - name: appliance
    rules:

      # Washing machine finished — fires once per cycle, routed to the
      # household ntfy topic (notify=appliance, send_resolved: false).
      #
      # Power profile measured on three cycles (2026-10-24..26): during a
      # cycle the draw never drops below ~3.6 W (pauses sit at ~4 W), and
      # ~1 min after the end the machine switches itself off to 0.0 W. So
      # "finished" = "0 W for 2 min after heavy load in the last 30 min".
      # The 100 W condition keeps program selection without a wash silent.
      # The alert resolves by itself ~25 min later, when the last load
      # sample leaves the 30m window.
      - alert: WashingMachineFinished
        expr: |
          max_over_time(shelly_power_watts{device="Waschmaschine"}[2m]) < 1
          and max_over_time(shelly_power_watts{device="Waschmaschine"}[30m]) > 100
        labels:
          severity: info
          notify: appliance
        annotations:
          summary: "Washing machine finished"
          description: "The cycle is complete, the machine has switched itself off."

      # Dryer finished — same routing as the washing machine.
      #
      # Power profile measured on one cycle (2026-10-30): heating at
      # ~2450 W with ~160 W dips (drum reversal), then ~10 min cool-down at
      # ~155 W, then anti-crease mode: ~2.6 W with single ~150-340 W drum
      # turns every 2-8 min, until someone opens the door (16.6 W). The
      # dryer never drops to 0 W, so the washer rule doesn't work here. The
      # 5-minute median ignores the drum turns and is only below 5 W in
      # anti-crease mode; the 1000 W condition requires a heating phase in
      # the last 30 min. Backtested: fires ~3 min into anti-crease mode
      # (~15 min after heating ends) and resolves by itself ~15 min later.
      - alert: DryerFinished
        expr: |
          quantile_over_time(0.5, shelly_power_watts{device="Trockner"}[5m]) < 5
          and max_over_time(shelly_power_watts{device="Trockner"}[30m]) > 1000
        labels:
          severity: info
          notify: appliance
        annotations:
          summary: "Dryer finished"
          description: "The cycle is complete, the dryer is in anti-crease mode."
