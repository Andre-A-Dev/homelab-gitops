apiVersion: 1

datasources:
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    # Container name resolves via the shared "monitoring" network
    url: http://alertmanager:9093
    jsonData:
      # Vanilla Prometheus Alertmanager (not Mimir/Cortex)
      implementation: prometheus
      # Keep Grafana-managed alerts out of your ntfy routing
      handleGrafanaManagedAlerts: false