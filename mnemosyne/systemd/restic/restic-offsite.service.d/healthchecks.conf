# Drop-in: report restic-offsite to Healthchecks.io (check UUID in $HC_RESTIC_OFFSITE).
# Install: sudo install -D -m 644 <this file> /etc/systemd/system/restic-offsite.service.d/healthchecks.conf
#          sudo systemctl daemon-reload
#
# External absence detection, independent of Prometheus/Alertmanager: if the
# timer never fires, the unit cannot start, or Mnemosyne is down, the ping is
# missing and Healthchecks alerts on its own.
#
# Both lines carry "-": an observer must never fail the thing it observes.
# A missing or wrong UUID is therefore NOT caught here - it shows up as a
# check that never receives pings, which Healthchecks reports as down.
[Service]
EnvironmentFile=/etc/homelab/healthchecks.env
ExecStartPre=-/usr/bin/curl -fsS -m 10 --retry 3 -o /dev/null https://hc-ping.com/${HC_RESTIC_OFFSITE}/start
# SERVICE_RESULT is set by systemd and also covers timeouts, signals and
# 203/EXEC - unlike the script's own exit code. $$ passes a literal $ to sh.
ExecStopPost=-/bin/sh -c 'curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "result=$$SERVICE_RESULT code=$$EXIT_CODE status=$$EXIT_STATUS" "https://hc-ping.com/$${HC_RESTIC_OFFSITE}/$$([ "$$SERVICE_RESULT" = success ] && echo 0 || echo 1)"'
