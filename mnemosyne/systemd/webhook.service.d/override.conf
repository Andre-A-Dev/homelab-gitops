# Drop-in for webhook.service on Mnemosyne.
# Install: sudo install -D -m 644 <this file> /etc/systemd/system/webhook.service.d/override.conf
#          sudo systemctl daemon-reload && sudo systemctl restart webhook
#
# hooks.tmpl.json holds no secrets and is tracked in Git; -template resolves
# the getenv calls from the root-only EnvironmentFile at startup.
[Service]
EnvironmentFile=/etc/webhook/mnemosyne.env
# Refuse to start with an empty secret - an empty HMAC key is a key everyone
# knows. $$ passes a literal $ to sh instead of letting systemd expand it.
ExecStartPre=/bin/sh -c 'test -n "$$DEPLOY_HOOK_SECRET" && test -n "$$PUMP_ALERTS_HOOK_SECRET"'
ExecStart=
ExecStart=/usr/bin/webhook -hooks /home/andre/homelab-infra/mnemosyne/webhook/hooks.tmpl.json -template -port 9000 -verbose
